[package]
name = "rpm-fl-cli"
version = "0.3.3"
edition = "2021"
# pk-cli-auth (cli-common v0.27.0) needs 1.89.
rust-version = "1.89"
description = "Real Property Management (AppFolio) owner portal from the command line — Keychain-secured, agent-friendly. Unofficial."
license = "MIT OR Apache-2.0"
repository = "https://github.com/piekstra/rpm-fl-cli"
homepage = "https://github.com/piekstra/rpm-fl-cli"
readme = "README.md"
keywords = ["appfolio", "property-management", "real-estate", "owner-portal", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "rpmfl"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pk-cli-core = { git = "https://github.com/piekstra/cli-common", tag = "v0.27.0", features = ["reqwest"] }
pk-cli-secrets = { git = "https://github.com/piekstra/cli-common", tag = "v0.27.0" }
pk-cli-config = { git = "https://github.com/piekstra/cli-common", tag = "v0.27.0" }
pk-cli-selfupdate = { git = "https://github.com/piekstra/cli-common", tag = "v0.27.0" }
pk-cli-auth = { git = "https://github.com/piekstra/cli-common", tag = "v0.27.0" }
pk-cli-http = { git = "https://github.com/piekstra/cli-common", tag = "v0.27.0" }
pk-cli-documents = { git = "https://github.com/piekstra/cli-common", tag = "v0.27.0" }
# `rpmfl mcp`: read-only tools for Claude over stdio or 127.0.0.1 (DESIGN.md §1.9).
pk-cli-mcp = { git = "https://github.com/piekstra/cli-common", tag = "v0.27.0", features = ["stdio", "http"] }
schemars = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "cookies", "rustls-tls"] }

[dev-dependencies]
# The MCP profile's conformance checks, for the tests only.
pk-cli-mcp = { git = "https://github.com/piekstra/cli-common", tag = "v0.27.0", features = ["test-util"] }
assert_cmd = "2"
predicates = "3"

[profile.release]
strip = true
lto = true
opt-level = "z"
