name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: fmt / clippy / test / build
    # macOS so the apple-native Keychain backend compiles and is exercised on the
    # platform this tool targets. Unit tests are pure logic and never touch the keychain.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - run: cargo build --release

  security:
    name: audit / deny / secrets
    runs-on: ubuntu-latest
    # gitleaks-action calls the PR API to enumerate the commits to scan, and
    # cargo-audit posts advisory annotations. Without these the job dies with
    # "Resource not accessible by integration" — but only on pull_request
    # events, since a push carries its commits in the payload. Declared here so
    # the first PR against this repo doesn't fail for a permissions reason
    # dressed up as a secret-scanning failure.
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo-audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
